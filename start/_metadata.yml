reference-location: document

freeze: false

format:
  html:
    code-link: true
    html-table-processing: none

engine: knitr

# Default knitr options
execute:
  echo: true
  message: true
  warning: true

knitr:
  opts_chunk:
    digits: 3
    comment: "#>"
    dev: "ragg_png"
    fig-align: "center"
    fig-width: 7.2916667
    out-width: "90%"
    collapse: true

# Default author
author:
  - given: W. Jake
    family: Thompson
    url: https://www.wjakethompson.com
    affiliation: ATLAS, University of Kansas
    affiliation-url: https://atlas.ku.edu
    orcid: 0000-0001-7339-0300
